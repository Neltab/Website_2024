<!DOCTYPE html>
<html>
<head>
    <meta charset="utf8"/>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background: #fff;
            color: #333;
            padding: 2em;
        }
        .option { margin-bottom: 2em; }
        .option h2 { margin-bottom: 0.5em; }
        .bar {
            display: inline-block;
            padding: 0.4em 1em;
            margin: 0.25em 0.5em 0.25em 0;
            color: white;
            font-size: 1.2em;
            font-weight: 200;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="option">
        <h2>Option A — Pastel Coral</h2>
        <span class="bar" style="background:#E8937C">Expériences professionnelles</span>
        <span class="bar" style="background:#E8AE7C">Projets personnels</span>
        <span class="bar" style="background:#E8C77C">Formations</span>
    </div>
    <div class="option">
        <h2>Option B — Pastel Lavender</h2>
        <span class="bar" style="background:#A78BBE">Expériences professionnelles</span>
        <span class="bar" style="background:#BE8BAE">Projets personnels</span>
        <span class="bar" style="background:#BE8B95">Formations</span>
    </div>
    <div class="option">
        <h2>Option C — Pastel Sky</h2>
        <span class="bar" style="background:#7CB5D9">Expériences professionnelles</span>
        <span class="bar" style="background:#7CD0D9">Projets personnels</span>
        <span class="bar" style="background:#7CD9BC">Formations</span>
    </div>
</body>
</html>
